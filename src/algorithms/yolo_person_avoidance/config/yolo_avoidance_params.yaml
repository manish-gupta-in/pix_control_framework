/**:
  ros__parameters:

    # ── YOLO Model ───────────────────────────────────────────────────────────
    # YOLOv8 model weights file. Will be downloaded automatically on first run.
    # Options: yolov8n.pt (fastest), yolov8s.pt, yolov8m.pt (most accurate)
    yolo_model: "yolov8n.pt"

    # Detection confidence threshold (0.0-1.0). Lower = more detections (more false positives).
    # Tune up if corridor environment causes too many false triggers.
    confidence_threshold: 0.40

    # ── Steering Avoidance Controller ────────────────────────────────────────
    # Gain: scales normalized screen offset (0..1) to steering degrees.
    # E.g., gain=300 means a person centered at screen edge → 300 deg steer cmd.
    gain: 300.0                     # deg / normalized_offset

    # Maximum avoidance steering angle commanded.
    # Safety manager caps at 450° (Whale HW limit: 8.72 rad = 499.6°).
    # 200° is conservative avoidance — enough to steer around a person.
    max_avoidance: 200.0            # deg  (safety_manager hw limit: 450°)

    # Deadband: fractional screen width within which no avoidance is triggered.
    # 0.08 = person within 8% of screen center is ignored.
    deadband: 0.08                  # fraction [0..1]

    # ── Ramp and Hold Parameters ─────────────────────────────────────────────
    # Steering ramp rate: maximum change in command per second.
    # Whale: max_steering_wheel_rate = 4.36 rad/s = 249.8 deg/s
    ramp_rate: 250.0                # deg/s  (Whale: 4.36 rad/s)

    # How many frames to hold the last avoidance command after a person disappears.
    # At 30fps camera, 15 frames = 0.5 seconds hold.
    hold_frames: 15                 # frames

    # ── Drive Parameters ─────────────────────────────────────────────────────
    # Steering speed sent to VCU. Whale: max_steering_wheel_rate = 4.36 rad/s = 249.8 deg/s.
    speed_dps: 250.0                # deg/s  (Whale: 4.36 rad/s = 249.8°/s)

    # Longitudinal speed while avoidance is active (m/s).
    # MUST be below safety_manager max_speed (3.0 m/s in hardware.yaml).
    # Slower speed gives more time to react to obstacles.
    target_speed: 1.5               # m/s  (matches straight_drive_node speed)

    # ── Display ──────────────────────────────────────────────────────────────
    # Set to false to enable OpenCV debug window (requires display).
    no_display: true
